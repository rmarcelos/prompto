      defaults:
        hero_body: "Use este guia para estruturar prompts mais claros, completos e fáceis de evoluir com sugestões marcadas por trechos."
        quality_body: "<ul><li><strong>Objetivo claro.</strong> Explique o que o modelo deve entregar e qual problema deve resolver.</li><li><strong>Contexto suficiente.</strong> Inclua público, cenário, dados de entrada e qualquer detalhe que mude a resposta esperada.</li><li><strong>Restrições explícitas.</strong> Defina limites, formato de saída, tom, idioma e o que deve ser evitado.</li><li><strong>Critério de qualidade.</strong> Diga como a resposta deve ser organizada para que outra pessoa consiga reutilizá-la sem retrabalho.</li></ul>"
        review_body: "<ul><li><strong>Adição:</strong> Use o marcador verde para incluir um novo trecho sem apagar o texto anterior.</li><li><strong>Alteração:</strong> Use o marcador amarelo para destacar uma substituição ou reescrita de trecho existente.</li><li><strong>Remoção:</strong> Use o marcador vermelho para indicar o que deve ser removido do prompt original.</li></ul>"
        workflow_body: "<ol><li>Leia o prompt inteiro antes de sugerir mudanças e identifique o objetivo principal dele.</li><li>Marque apenas os trechos que realmente precisam de adição, troca ou remoção, evitando comentários genéricos.</li><li>Ao final, explique em uma frase o ganho esperado com a revisão: clareza, contexto, precisão ou consistência.</li></ol>"
        example_body: "<p><strong>Prompt base</strong></p><p>Escreva um email para um cliente sobre atraso no projeto.</p><p><strong>Sugestão de melhoria</strong></p><p>Adicione o prazo revisado em verde, destaque em amarelo o trecho que precisa de tom mais empático e marque em vermelho qualquer promessa que a equipe não consiga cumprir.</p>"
