services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prompto_development}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      target: development
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RAILS_ENV: development
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-prompto_development}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      ACTIVE_STORAGE_SERVICE: local
    ports:
      - "3000:3000"
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
      - rails_tmp:/rails/tmp
      - rails_storage:/rails/storage
    command: bash -lc "bin/rails db:prepare && ./bin/dev -b 0.0.0.0"

volumes:
  bundle_cache:
  postgres_data:
  rails_storage:
  rails_tmp: